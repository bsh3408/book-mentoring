<!-- ===== 나의 첫 웹앱 · 프론트엔드(홀) ===== -->
<!-- 손님이 실제로 보는 화면. 여기를 바꾸면 홈페이지가 바뀐다.        -->
<!-- 앱스크립트에서는 스타일(CSS)까지 이 한 파일 안에 함께 넣는다.     -->
<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:linear-gradient(135deg,#0f766e,#1e3a5f); color:#fff; padding:24px;
  }
  .card{
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.25);
    border-radius:20px; padding:34px 28px; max-width:420px; width:100%;
    text-align:center; backdrop-filter:blur(6px);
  }
  h1{font-size:1.6rem; margin:0 0 10px; line-height:1.3}
  p{margin:0 0 18px; color:#e6f2f0; font-size:1rem; line-height:1.6}
  button{
    font-size:1rem; font-weight:700; color:#0f766e; background:#fff; border:0;
    border-radius:999px; padding:12px 22px; cursor:pointer;
  }
  button:hover{filter:brightness(.95)}
  #msg{margin-top:14px; min-height:1.4em; font-weight:700; color:#ffe08a}
  /* 화면이 좁아지면(폰) 글씨를 조금 줄인다 = 반응형 */
  @media (max-width:420px){ h1{font-size:1.35rem} }
</style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요! 제 첫 웹앱이에요 📖</h1>
    <p>이 화면이 보이면 성공입니다.<br>아래 버튼을 눌러 보세요.</p>
    <button onclick="hello()">눌러보기</button>
    <div id="msg"></div>
  </div>

  <script>
    // 자바스크립트(근육) — 버튼을 누르면 반응한다
    function hello(){
      document.getElementById('msg').textContent = '🎉 내가 만든 웹앱이 움직였어요!';
    }
  </script>
</body>
</html>
